<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </header>

  <main>
    {% if page.title and page.url != "/" %}<h1>{{ page.title }}</h1>{% endif %}
    {{ content }}
  </main>

  <footer>
    <a href="mailto:quintana.alexi@gmail.com">Email</a> ·
    <a href="https://scholar.google.com/citations?user=CfPeWzUAAAAJ&amp;hl=en">Google Scholar</a> ·
    <a href="https://orcid.org/0000-0002-7315-9480">ORCID</a> ·
    <a href="https://www.lazerlab.net/people/alexi-quintana-mathe">Lazer Lab</a> ·
    <a href="https://coalesce-lab.com/en/team/7/alexi-quintana-mathe">COALESCE Lab</a>
  </footer>
</body>
</html>
